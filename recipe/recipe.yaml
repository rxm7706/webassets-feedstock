# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: webassets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/webassets/webassets-${{ version 
    }}.tar.gz
  sha256: 0520e5fd6fbcc012f486fefc61b966474da8fc1b35b0569a9ec2cb0782f1607a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml >=6.0.2
    - zope-dottedname >=6.0

tests:
  - python:
      imports:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/miracle2k/webassets/
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Media asset management for Python, with glue code for various web 
    frameworks
  description: |
    Media asset management for Python, with glue code for various web frameworks
  repository: https://github.com/miracle2k/webassets/
  documentation: https://webassets.readthedocs.io/
extra:
  recipe-maintainers:
    - rxm7706
    - pmlandwehr
